<text x="56" y="42.5" font-size="16" font-weight="600" fill="#1f2328">Crawl</text>
<text x="28" y="70" font-size="14" fill="#59636e">finds every page,</text>
<text x="28" y="88" font-size="14" fill="#59636e">also behind a login</text>
