<text x="320" y="42.5" font-size="16" font-weight="600" fill="#1f2328">Audit</text>
<text x="292" y="70" font-size="14" fill="#59636e">mobile and desktop,</text>
<text x="292" y="88" font-size="14" fill="#59636e">with and without state</text>
<rect x="276" y="130" width="232" height="86" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
