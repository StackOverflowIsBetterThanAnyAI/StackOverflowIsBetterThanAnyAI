<svg xmlns="http://www.w3.org/2000/svg" width="520" height="228" viewBox="0 0 520 228" role="img" aria-labelledby="title desc">
<title id="title">How the Full Accessibility Audit works</title>
<desc id="desc">1. Crawl: finds every page, also behind a login. 2. Audit: mobile and desktop, with and without state. 3. Check: WCAG 2.2 via axe-core plus own checks. 4. Report: JSON + Markdown, fails on A / AA issues.</desc>
